name: Test and deploy

# Tests run on every push and pull request. Deploying to GitHub Pages happens
# only from main (or a manual run), and only after the tests pass.
#
# Requires repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". (Under "Deploy from a branch", Pages publishes main
# directly, skipping both the tests and the version stamp below.)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Every deploy gets a distinct shell cache, so phones pick up the new
      # version even when nobody bumped VERSION by hand. The Bible data cache
      # (data-v1) is untouched, so it isn't downloaded again.
      - name: Stamp the service worker with this commit
        run: |
          sha="${GITHUB_SHA::7}"
          sed -i -E "s/^const VERSION = '([^']*)';/const VERSION = '\1+${sha}';/" sw.js
          grep -E "^const VERSION = '.*\+${sha}';" sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
